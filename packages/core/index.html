<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrapesJS</title>
    <link rel="stylesheet" href="dist/css/grapes.min.css" />
    <script src="grapes.min.js"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }
      #gjs {
          height: 80% !important;
      }
    </style>
  </head>

  <body>
    <div id="gjs" style="height: 0px; overflow: hidden">
      <div class="panel">
        <h1 class="welcome">Welcome to</h1>
        <div class="big-title">
          <svg class="logo" viewBox="0 0 100 100">
            <path
              d="M40 5l-12.9 7.4 -12.9 7.4c-1.4 0.8-2.7 2.3-3.7 3.9 -0.9 1.6-1.5 3.5-1.5 5.1v14.9 14.9c0 1.7 0.6 3.5 1.5 5.1 0.9 1.6 2.2 3.1 3.7 3.9l12.9 7.4 12.9 7.4c1.4 0.8 3.3 1.2 5.2 1.2 1.9 0 3.8-0.4 5.2-1.2l12.9-7.4 12.9-7.4c1.4-0.8 2.7-2.2 3.7-3.9 0.9-1.6 1.5-3.5 1.5-5.1v-14.9 -12.7c0-4.6-3.8-6-6.8-4.2l-28 16.2"
            />
          </svg>
          <span>GrapesJS</span>
        </div>
        <div class="description">
          This is a demo content from index.html. For the development, you shouldn't edit this file, instead you can
          copy and rename it to _index.html, on next server start the new file will be served, and it will be ignored by
          git.123
        </div>
      </div>
      <style>
        .panel {
          width: 90%;
          max-width: 700px;
          border-radius: 3px;
          padding: 30px 20px;
          margin: 150px auto 0px;
          background-color: #d983a6;
          box-shadow: 0px 3px 10px 0px rgba(0, 0, 0, 0.25);
          color: rgba(255, 255, 255, 0.75);
          font: caption;
          font-weight: 100;
        }

        .welcome {
          text-align: center;
          font-weight: 100;
          margin: 0px;
        }

        .logo {
          width: 70px;
          height: 70px;
          vertical-align: middle;
        }

        .logo path {
          pointer-events: none;
          fill: none;
          stroke-linecap: round;
          stroke-width: 7;
          stroke: #fff;
        }

        .big-title {
          text-align: center;
          font-size: 3.5rem;
          margin: 15px 0;
        }

        .description {
          text-align: justify;
          font-size: 1rem;
          line-height: 1.5rem;
        }
      </style>
    </div>
    <div class="elements-drawer" id="elements-drawer">
						<!-- 元素抽屉内容由 RenderJS 填充 -->
        </div>
    <button onclick="changeDmode()">点我</button>
<!--  <script src="touchSupport.js"></script>-->
  <script src="DragDropTouch.js"></script>
    <script type="text/javascript">
      var editor = grapesjs.init({
        showOffsets: 1,
        noticeOnUnload: 0,
        container: '#gjs',
        height: '100%',
        fromElement: true,
          dragMode: 'absolute', // 'absolute' | 'translate'

        storageManager: { autoload: 0 },
        blockManager: {
						custom: true,
						blocks:[{
              id: 'text',
              label: 'Text',
              content: '<div data-gjs-type="text">Insert your text here</div>',
            },]
					},
        plugins: [touchOfficial],
        styleManager: {
          sectors: [
            {
              name: 'General',
              open: false,
              buildProps: ['float', 'display', 'position', 'top', 'right', 'left', 'bottom'],
            },
            {
              name: 'Flex',
              open: false,
              buildProps: [
                'flex-direction',
                'flex-wrap',
                'justify-content',
                'align-items',
                'align-content',
                'order',
                'flex-basis',
                'flex-grow',
                'flex-shrink',
                'align-self',
              ],
            },
            {
              name: 'Dimension',
              open: false,
              buildProps: ['width', 'height', 'max-width', 'min-height', 'margin', 'padding'],
            },
            {
              name: 'Typography',
              open: false,
              buildProps: [
                'font-family',
                'font-size',
                'font-weight',
                'letter-spacing',
                'color',
                'line-height',
                'text-shadow',
              ],
            },
            {
              name: 'Decorations',
              open: false,
              buildProps: [
                'border-radius-c',
                'background-color',
                'border-radius',
                'border',
                'box-shadow',
                'background',
              ],
            },
            {
              name: 'Extra',
              open: false,
              buildProps: ['transition', 'perspective', 'transform'],
            },
          ],
        },
      });
      editor.BlockManager.add('testBlock', {
        label: 'Block',
        attributes: { class: 'gjs-fonts gjs-f-b1' },
        content: `<div style="padding-top:50px; padding-bottom:50px; text-align:center">Test block</div>`,
      });
      editor.on('load', () => {
					renderElementsDrawer(editor.BlockManager.getAll());
				});
      function renderElementsDrawer() {
			  const drawer = document.getElementById('elements-drawer');
			  if (!drawer) return console.error('未找到元素抽屉容器');
			  drawer.innerHTML = '';
			
			  editor.BlockManager.getAll().forEach(block => {
			    const blockItem = document.createElement('div');
			    blockItem.className = 'element-item block';
			    blockItem.setAttribute('data-from', 'blockmanager');
			    blockItem.draggable = true; // Enable dragging
			    blockItem.__block = block; // Store block reference
			
			    // Prevent default touch behavior to ensure plugin handles it
			    // blockItem.addEventListener('touchstart', (e) => {
			    //   e.stopPropagation();
			    // });
			
			    // Fallback for desktop dragging
			    blockItem.addEventListener('dragstart', (e) => {
			      editor.BlockManager.startDrag(block);
			      e.dataTransfer.setData('text/plain', block.id);
			    });

			    blockItem.addEventListener('dragend', () => {
			      editor.BlockManager.endDrag();
			    });

			    const media = document.createElement('div');
			    media.className = 'element-media';
			    media.innerHTML = block.getMedia() || '';
			    blockItem.appendChild(media);
			
			    const label = document.createElement('div');
			    label.className = 'element-label';
			    label.textContent = block.getLabel();
			    blockItem.appendChild(label);
			
			    drawer.appendChild(blockItem);
			  });
			}
      function changeDmode(){
        if(editor.getModel().get("dmode") !== "absolute")
          editor.getModel().set("dmode","absolute")
        else
          editor.getModel().set("dmode","translate")
      }
    </script>
  </body>
</html>
